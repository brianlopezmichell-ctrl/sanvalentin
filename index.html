<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti 💜</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #5e0b87, #a855f7);
    color: white;
    font-family: 'Segoe UI', cursive;
    text-align: center;
    overflow-x: hidden;
}

/* pantallas */
#inicio, #carta {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.92);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* carta */
#carta {
    display: none;
    overflow-y: auto;
    padding: 25px;
}

/* texto carta bonito */
#textoCarta {
    max-width: 95%;
    font-size: 22px;
    line-height: 1.8;
    white-space: pre-line;
    font-family: 'Segoe UI', cursive;
}

/* 🔥 contenido ocupa toda pantalla */
#contenido {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* 📸 fotos grandes */
img {
    width: 90%;
    max-width: 420px;
    margin: 20px auto;
    border-radius: 25px;
    display: block;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

/* 📝 textos grandes y lindos */
.mensaje {
    font-size: 26px;
    margin-top: 20px;
    padding: 10px;
    font-weight: bold;
}

/* botones más bonitos */
button {
    padding: 12px 25px;
    font-size: 20px;
    margin-top: 20px;
    cursor: pointer;
    border-radius: 12px;
    border: none;
}

/* corazones */
.corazon {
    position: fixed;
    top: -10px;
    color: #d291ff;
    font-size: 22px;
    animation: caer linear infinite;
}

@keyframes caer {
    to { transform: translateY(100vh); }
}
</style>
</head>

<body>

<audio id="musica" loop>
    <source src="cancion.mp3" type="audio/mpeg">
</audio>

<!-- INICIO -->
<div id="inicio">
    <h2>💜 Tengo algo importante para ti 🥺</h2>
    <button onclick="mostrarCarta()">Continuar 💜</button>
</div>

<!-- CARTA -->
<div id="carta">
    <div id="textoCarta"></div>
    <button onclick="empezar()">Ver recuerdos 💜</button>
</div>

<div id="contenido"></div>

<script>

/* CARTA (CORREGIDA) */
const cartaTexto = `💜 MI AMOR...

Quiero decirte esto desde lo más profundo de mi corazón 💖, porque sé que estamos pasando por momentos difíciles, llenos de retos y obstáculos 🥺 que a veces parecen más grandes que nosotros. Pero aun así, aquí estoy, eligiéndote cada día 💍, apostando por lo nuestro, creyendo en lo que estamos construyendo juntos 🏡✨.

Solo te pido algo muy sencillo pero muy importante: no sueltes mi mano 🤝. Quédate conmigo, incluso cuando las cosas no sean fáciles 💔. Elígeme, así como yo te elijo 💞, no porque sea lo más cómodo, sino porque sabemos que lo nuestro vale la pena 💯. Prefiero mil veces seguir creciendo contigo, aprendiendo contigo, que empezar de cero con alguien más que no te ame como yo lo hago 😔❤️.

También quiero que cuidemos lo nuestro. No hbalemos el pasado ni dejemos que personas o situaciones del pasado entren a lo que estamos formando. Sabes bien que muchas de nuestras peleas nacen de ahí 😞, y no quiero que eso siga dañando lo que tenemos 💔. Nuestro presente y nuestro futuro merecen más que eso 🌅✨.

Hay cosas que a veces me incomodan, como lo que se comparte o se muestra 📱, y no lo digo para controlar, sino porque me importa lo nuestro y quiero que lo entendamos desde el respeto y el amor 🤍. Estamos en un proceso, estamos creciendo, aprendiendo a ser mejores el uno para el otro 💑.

Yo te veo en mi futuro. Te veo como la mujer con la que quiero construir una vida 🏠💍, y por eso lucho 💪, por eso insisto, por eso sigo aquí ❤️‍🔥. Pero también necesito que, cuando lleguen los momentos difíciles ⚡, no sea solo yo quien pelee por esto 🥺. Quiero que tú también lo hagas, que también elijas quedarte 🤍, que también defiendas lo nuestro ❤️.

Antes de decir o hacer algo que pueda lastimarnos 💔, pensemos en todo lo que queremos ser, en todo lo que soñamos juntos 🌠. No quiero sentirme insuficiente, tu me dijiste que soy tu niños de ojitos bonitos, no quiero que mis ojos lloren por tus acitutdes o comportamientos, yo se que me amas y se que no quieres eso, por favor arriesgate por mi y hazme el niño más feliz que siempre me haz
haz hecho , no dejemos que errores del pasado destruyan el futuro que tanto anhelamos.

Te amo ❤️, y por eso no me rindo . Solo espero que tú tampoco lo hagas y pongas todo de ti🤍 

RECUERDA ERES EL AMOR DE MI VIDA`;

let i = 0;

function escribirCarta(){
    if(i < cartaTexto.length){
        document.getElementById("textoCarta").innerHTML += cartaTexto[i];
        i++;
        setTimeout(escribirCarta, 20);
    }
}

/* MOSTRAR CARTA */
function mostrarCarta(){
    document.getElementById("musica").play().catch(()=>{});
    document.getElementById("inicio").style.display = "none";
    document.getElementById("carta").style.display = "flex";
    escribirCarta();
}

/* EMPEZAR */
function empezar(){
    document.getElementById("carta").style.display="none";
    mostrar();
}

/* FOTOS */
const fotos = [
"foto1.jpg","foto2.jpg","foto3.jpg","foto4.jpg","foto5.jpg",
"foto6.jpg","foto7.jpg","foto8.jpg","foto9.jpg","foto10.jpg",
"foto11.jpg","foto12.jpg","foto13.jpg","foto14.jpg","foto15.jpg",
"foto16.jpg","foto17.jpg","foto27.jpg","foto29.jpg"
];

const textos = [
"💜 Porque no quiero soltarnos 🥺💗",
"💞 Porque lo nuestro tiene una historia aun que escribir 💖✨",
"🥺 Porque aún podemos mejorar y dar todo por ambos 💕",
"💜 Porque juntos somos mejores 💫",
"💖 Porque cuando estoy contigo me haces feliz🥰",
"💞 Porque superamos cosas 💗",
"💓 Porque aún nos amamos demasiaddo 💖",
"💜 Porque contigo quiero lograr muchas cosas 🥺",
"💖 Porque estos momentos importan 💕",
"💞 Porque valemos lo nuestro nos es un relación común 💫",
"🥺 Porque te amo más que a mi mismo 💗",
"💜 Porque no debemos rendirnos 💖",
"💖 Porque creo y confio en ti que daras todo por mi como yo lo estoy haciendo 🥺",
"💞 Porque lo nuestro es real 💕",
"💓 Porque quiero que te cases conmigo 🥰",
"💜 Porque a pesar de todo te sigo eligiendo 💗",
"💞 Porque no quiero perderte 💖",
"💓 Porque nos estamos formando, tú como mi esposa y yo como tu esposo 💫",
"💜 Porque eres el amor de mi vida 🥺"
];

let index = 0;

function mostrar(){
    const cont = document.getElementById("contenido");

    if(index < fotos.length){
        cont.innerHTML = `
        <div class="mensaje">${textos[index]}</div>
        <img src="${fotos[index]}">
        `;
        index++;
        setTimeout(mostrar, 3000);
    } else {
        final();
    }
}

/* FINAL (COMO TÚ PEDISTE) */
function final(){
    const cont = document.getElementById("contenido");

    cont.innerHTML = `
    <div class="mensaje">
    💜🥺 ¿Estás dispuesta a arriesgar todo por mí otra vez y mejorar por nosotros?
    </div>

    <button onclick="si()">Sí 💜</button>
    <button id="no">No 💔</button>
    `;

    const no = document.getElementById("no");
    no.onmouseover = ()=>{
        no.style.position="absolute";
        no.style.top=Math.random()*80+"vh";
        no.style.left=Math.random()*80+"vw";
    };
}

/* CUANDO DICE SÍ */
function si(){
    document.getElementById("contenido").innerHTML = `
    <div class="mensaje" style="font-size:24px;">
    🥺💗 te amo demasiado mi vida...<br><br>
    Esa es mi niña de la que me enamoré 💜<br>
    de la que lucha por lo que ama 💖<br>
    mi cachetitos 🥰💗
    </div>
    `;
}

/* CORAZONES */
function crearCorazon(){
    const c = document.createElement("div");
    c.className="corazon";
    c.innerHTML="💜";
    c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
}
setInterval(crearCorazon,300);

</script>

</body>
</html>
