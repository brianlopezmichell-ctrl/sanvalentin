<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti 💜</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #6a0dad, #9b59b6);
    color: white;
    font-family: Arial;
    text-align: center;
    overflow: hidden;
}

h1 {
    margin-top: 20px;
}

#contenido {
    margin-top: 30px;
}

img, video {
    width: 320px;
    border-radius: 20px;
    margin-top: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

.mensaje {
    font-size: 1.4em;
    margin-top: 20px;
    padding: 15px;
}

/* botones */
.boton {
    padding: 12px 25px;
    font-size: 18px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#si {
    background: #d291ff;
    color: white;
}

#no {
    background: #444;
    color: white;
    position: absolute;
}

/* corazones */
.corazon {
    position: fixed;
    top: -10px;
    color: #d291ff;
    font-size: 20px;
    animation: caer linear infinite;
}

@keyframes caer {
    to {
        transform: translateY(100vh);
    }
}
</style>
</head>

<body>

<h1>💜 Para nosotros 💜</h1>

<!-- Música -->
<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<div id="contenido"></div>

<script>
const elementos = [
    {tipo:"img", src:"foto1.jpg", texto:"Porque contigo viví momentos únicos 💜"},
    {tipo:"img", src:"foto2.jpg", texto:"Porque nuestra historia vale la pena"},
    {tipo:"img", src:"foto3.jpg", texto:"Porque aún me haces feliz"},
    {tipo:"img", src:"foto4.jpg", texto:"Porque juntos somos mejores"},
    {tipo:"img", src:"foto5.jpg", texto:"Porque no quiero perderte"},
    {tipo:"img", src:"foto6.jpg", texto:"Porque superamos muchas cosas"},
    {tipo:"img", src:"foto7.jpg", texto:"Porque aún hay amor"},
    {tipo:"img", src:"foto8.jpg", texto:"Porque contigo todo era especial"},
    {tipo:"img", src:"foto9.jpg", texto:"Porque extraño nuestra felicidad"},
    {tipo:"img", src:"foto10.jpg", texto:"Porque vales mucho para mí"},
    {tipo:"img", src:"foto11.jpg", texto:"Porque quiero construir algo contigo"},
    {tipo:"img", src:"foto12.jpg", texto:"Porque merecemos otra oportunidad"},
    {tipo:"img", src:"foto13.jpg", texto:"Porque aún creo en nosotros"},
    {tipo:"img", src:"foto14.jpg", texto:"Porque fuimos felices"},
    {tipo:"img", src:"foto15.jpg", texto:"Porque quiero volver a sonreír contigo"},
    {tipo:"img", src:"foto16.jpg", texto:"Porque te sigo eligiendo"},
    {tipo:"img", src:"foto17.jpg", texto:"Porque no quiero rendirme"},
    {tipo:"img", src:"foto27.jpg", texto:"Porque aún tenemos historia"},
    {tipo:"img", src:"foto29.jpg", texto:"Porque te extraño 💜"},

    {tipo:"video", src:"video18.mp4", texto:"Porque nuestros recuerdos siguen vivos"},
    {tipo:"video", src:"video19.mp4", texto:"Porque todo esto fue real"},
    {tipo:"video", src:"video20.mp4", texto:"Porque quiero más momentos así"},
    {tipo:"video", src:"video21.mp4", texto:"Porque juntos éramos felices"},
    {tipo:"video", src:"video22.mp4", texto:"Porque aún podemos mejorar"},
    {tipo:"video", src:"video24.mp4", texto:"Porque no todo está perdido"},
    {tipo:"video", src:"video25.mp4", texto:"Porque quiero intentarlo otra vez"},
    {tipo:"video", src:"video26.mp4", texto:"Porque vales la pena"},
    {tipo:"video", src:"video28.mp4", texto:"Porque te sigo amando 💜"}
];

let index = 0;

function mostrarElemento() {
    const cont = document.getElementById("contenido");
    cont.innerHTML = "";

    if(index < elementos.length){
        const item = elementos[index];

        const texto = document.createElement("div");
        texto.className = "mensaje";
        texto.innerText = item.texto;

        cont.appendChild(texto);

        if(item.tipo === "img"){
            const img = document.createElement("img");
            img.src = item.src;
            cont.appendChild(img);
        } else {
            const video = document.createElement("video");
            video.src = item.src;
            video.controls = true;
            video.autoplay = true;
            cont.appendChild(video);
        }

        index++;
        setTimeout(mostrarElemento, 4000);
    } else {
        mostrarPregunta();
    }
}

function mostrarPregunta(){
    const cont = document.getElementById("contenido");
    cont.innerHTML = `
        <div class="mensaje">
        ¿Estás dispuesta a arriesgar todo por mí otra vez y dar lo mejor de ti por nosotros? 💜
        </div>
        <button id="si" class="boton">Sí 💜</button>
        <button id="no" class="boton">No 💔</button>
    `;

    document.getElementById("si").onclick = () => {
        cont.innerHTML = `
            <div class="mensaje" style="font-size:2em;">
            💜 Podemos intentarlo otra vez 💜
            </div>
        `;
    };

    const noBtn = document.getElementById("no");
    noBtn.onmouseover = () => {
        noBtn.style.top = Math.random() * 80 + "vh";
        noBtn.style.left = Math.random() * 80 + "vw";
    };
}

mostrarElemento();

/* corazones */
function crearCorazon() {
    const corazon = document.createElement("div");
    corazon.classList.add("corazon");
    corazon.innerHTML = "💜";

    corazon.style.left = Math.random() * 100 + "vw";
    corazon.style.animationDuration = (Math.random() * 3 + 2) + "s";

    document.body.appendChild(corazon);

    setTimeout(() => {
        corazon.remove();
    }, 5000);
}

setInterval(crearCorazon, 300);
</script>

</body>
</html>
