<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti 💜</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #5e0b87, #a855f7);
    color: white;
    font-family: Arial;
    text-align: center;
    overflow-x: hidden;
}

/* inicio */
#inicio, #carta {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#carta { display: none; }

#textoCarta {
    max-width: 600px;
    font-size: 20px;
    line-height: 1.5;
}

/* contenido */
img {
    width: 320px;
    margin-top: 20px;
    border-radius: 20px;
}

.mensaje {
    font-size: 22px;
    margin-top: 20px;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    margin-top: 20px;
    cursor: pointer;
}

/* corazones */
.corazon {
    position: fixed;
    top: -10px;
    color: #d291ff;
    font-size: 20px;
    animation: caer linear infinite;
}

@keyframes caer {
    to { transform: translateY(100vh); }
}
</style>
</head>

<body>

<!-- INICIO -->
<div id="inicio">
    <h2>💜 Tengo algo importante para ti 🥺</h2>
    <button onclick="mostrarCarta()">Continuar 💜</button>
</div>

<!-- CARTA -->
<div id="carta">
    <div id="textoCarta"></div>
    <button onclick="empezar()">Ver recuerdos 💜</button>
</div>

<div id="contenido"></div>

<script>

/* mostrar carta */
function mostrarCarta(){
    document.getElementById("inicio").style.display="none";
    document.getElementById("carta").style.display="flex";
    escribirCarta();
}

/* carta animada */
const cartaTexto = `💜 Hola...
He estado pensando mucho en nosotros...

En todo lo que vivimos 🥺💞
En cada risa, cada momento ✨

Sé que tuvimos problemas...
pero lo nuestro fue real 💖

Y no quiero soltarnos 💜

Aún creo en nosotros 🥺💗`;

let i=0;
function escribirCarta(){
    if(i < cartaTexto.length){
        document.getElementById("textoCarta").innerHTML += cartaTexto[i];
        i++;
        setTimeout(escribirCarta,30);
    }
}

/* empezar fotos */
function empezar(){
    document.getElementById("carta").style.display="none";
    mostrar();
}

/* fotos */
const fotos = [
"foto1.jpg","foto2.jpg","foto3.jpg","foto4.jpg","foto5.jpg",
"foto6.jpg","foto7.jpg","foto8.jpg","foto9.jpg","foto10.jpg",
"foto11.jpg","foto12.jpg","foto13.jpg","foto14.jpg","foto15.jpg",
"foto16.jpg","foto17.jpg","foto27.jpg","foto29.jpg"
];

const textos = [
"💜 Porque no deberías soltarnos 🥺💗",
"💞 Porque lo nuestro vale la pena 💖✨",
"🥺 Porque aún podemos intentarlo 💕",
"💜 Porque juntos éramos mejores 💫",
"💖 Porque fuimos felices 🥰",
"💞 Porque superamos cosas 💗",
"💓 Porque aún hay amor 💖",
"💜 Porque contigo todo tenía sentido 🥺",
"💖 Porque estos momentos importan 💕",
"💞 Porque valemos la pena 💫",
"🥺 Porque aún hay futuro 💗",
"💜 Porque no debemos rendirnos 💖",
"💖 Porque creo en nosotros 🥺",
"💞 Porque fue real 💕",
"💓 Porque quiero volver a esto 🥰",
"💜 Porque te sigo eligiendo 💗",
"💞 Porque no quiero perderte 💖",
"💓 Porque nuestra historia sigue 💫",
"💜 Porque aún te extraño 🥺"
];

let index=0;

function mostrar(){
    const cont = document.getElementById("contenido");

    if(index < fotos.length){
        cont.innerHTML = `
        <div class="mensaje">${textos[index]}</div>
        <img src="${fotos[index]}">
        `;
        index++;
        setTimeout(mostrar,3000);
    } else {
        final();
    }
}

/* final */
function final(){
    const cont = document.getElementById("contenido");

    cont.innerHTML = `
    <div class="mensaje">
    💜🥺 ¿Estás dispuesta a arriesgar todo por mí otra vez y mejorar por nosotros?
    </div>
    `;

    setTimeout(()=>{
        cont.innerHTML += `
        <div class="mensaje">
        🥺💗 te amo demasiado...<br>
        esa es mi niña de cachetitos bonitos 🥰💗
        </div>
        `;
    },2000);

    setTimeout(()=>{
        cont.innerHTML += `
        <button onclick="si()">Sí 💜</button>
        <button id="no">No 💔</button>
        `;

        const no = document.getElementById("no");
        no.onmouseover = ()=>{
            no.style.position="absolute";
            no.style.top=Math.random()*80+"vh";
            no.style.left=Math.random()*80+"vw";
        };

    },4000);
}

function si(){
    document.getElementById("contenido").innerHTML =
    "<h1>💜✨ Podemos intentarlo otra vez 💖🥺</h1>";
}

/* corazones */
function crearCorazon(){
    const c=document.createElement("div");
    c.className="corazon";
    c.innerHTML="💜";
    c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
}
setInterval(crearCorazon,300);

</script>

</body>
</html>
