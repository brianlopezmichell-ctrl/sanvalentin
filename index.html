<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti 💜</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #5e0b87, #a855f7);
    color: white;
    font-family: Arial;
    text-align: center;
}

/* pantallas */
#inicio, #carta {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#carta { 
    display: none; 
    overflow-y: auto;
    padding: 20px;
}

/* carta texto */
#textoCarta {
    max-width: 90%;
    font-size: 20px;
    line-height: 1.6;
    white-space: pre-line;
}

/* contenido */
img {
    width: 320px;
    margin-top: 20px;
    border-radius: 20px;
}

.mensaje {
    font-size: 22px;
    margin-top: 20px;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    margin-top: 20px;
    cursor: pointer;
}

/* corazones */
.corazon {
    position: fixed;
    top: -10px;
    color: #d291ff;
    font-size: 20px;
    animation: caer linear infinite;
}

@keyframes caer {
    to { transform: translateY(100vh); }
}
</style>
</head>

<body>

<audio id="musica" loop>
    <source src="cancion.mp3" type="audio/mpeg">
</audio>

<!-- INICIO -->
<div id="inicio">
    <h2>💜 Tengo algo importante para ti 🥺</h2>
    <button onclick="mostrarCarta()">Continuar 💜</button>
</div>

<!-- CARTA -->
<div id="carta">
    <div id="textoCarta"></div>
    <button onclick="empezar()">Ver recuerdos 💜</button>
</div>

<div id="contenido"></div>

<script>

/* CARTA (CORREGIDA) */
const cartaTexto = `💜 MI AMOR...

Quiero escribirte esto desde lo más profundo de mi corazón 💖, porque sé que estamos pasando por momentos difíciles...

Solo te pido algo muy sencillo pero muy importante: no sueltes mi mano 🤝...

También quiero que cuidemos lo nuestro 🛡️...

Hay cosas que a veces me incomodan...

Yo te veo en mi futuro 🔮...

Antes de decir o hacer algo...

Te amo ❤️, y por eso no me rindo 💪  

RECUERDA ERES EL AMOR DE MI VIDA 💜`;

let i = 0;

function escribirCarta(){
    if(i < cartaTexto.length){
        document.getElementById("textoCarta").innerHTML += cartaTexto[i];
        i++;
        setTimeout(escribirCarta, 20);
    }
}

/* MOSTRAR CARTA */
function mostrarCarta(){
    document.getElementById("musica").play().catch(()=>{});
    document.getElementById("inicio").style.display = "none";
    document.getElementById("carta").style.display = "flex";
    escribirCarta();
}

/* EMPEZAR */
function empezar(){
    document.getElementById("carta").style.display="none";
    mostrar();
}

/* FOTOS */
const fotos = [
"foto1.jpg","foto2.jpg","foto3.jpg","foto4.jpg","foto5.jpg",
"foto6.jpg","foto7.jpg","foto8.jpg","foto9.jpg","foto10.jpg",
"foto11.jpg","foto12.jpg","foto13.jpg","foto14.jpg","foto15.jpg",
"foto16.jpg","foto17.jpg","foto27.jpg","foto29.jpg"
];

const textos = [
"💜 Porque no deberías soltarnos 🥺💗",
"💞 Porque lo nuestro vale la pena 💖✨",
"🥺 Porque aún podemos intentarlo 💕",
"💜 Porque juntos éramos mejores 💫",
"💖 Porque fuimos felices 🥰",
"💞 Porque superamos cosas 💗",
"💓 Porque aún hay amor 💖",
"💜 Porque contigo todo tenía sentido 🥺",
"💖 Porque estos momentos importan 💕",
"💞 Porque valemos la pena 💫",
"🥺 Porque aún hay futuro 💗",
"💜 Porque no debemos rendirnos 💖",
"💖 Porque creo en nosotros 🥺",
"💞 Porque fue real 💕",
"💓 Porque quiero volver a esto 🥰",
"💜 Porque te sigo eligiendo 💗",
"💞 Porque no quiero perderte 💖",
"💓 Porque nuestra historia sigue 💫",
"💜 Porque aún te extraño 🥺"
];

let index = 0;

function mostrar(){
    const cont = document.getElementById("contenido");

    if(index < fotos.length){
        cont.innerHTML = `
        <div class="mensaje">${textos[index]}</div>
        <img src="${fotos[index]}">
        `;
        index++;
        setTimeout(mostrar, 3000);
    } else {
        final();
    }
}

/* FINAL (COMO TÚ PEDISTE) */
function final(){
    const cont = document.getElementById("contenido");

    cont.innerHTML = `
    <div class="mensaje">
    💜🥺 ¿Estás dispuesta a arriesgar todo por mí otra vez y mejorar por nosotros?
    </div>

    <button onclick="si()">Sí 💜</button>
    <button id="no">No 💔</button>
    `;

    const no = document.getElementById("no");
    no.onmouseover = ()=>{
        no.style.position="absolute";
        no.style.top=Math.random()*80+"vh";
        no.style.left=Math.random()*80+"vw";
    };
}

/* CUANDO DICE SÍ */
function si(){
    document.getElementById("contenido").innerHTML = `
    <div class="mensaje" style="font-size:24px;">
    🥺💗 te amo demasiado...<br><br>
    esa es mi niña de la que me enamoré 💜<br>
    de la que lucha por lo que ama 💖<br>
    mi cachetitos 🥰💗
    </div>
    `;
}

/* CORAZONES */
function crearCorazon(){
    const c = document.createElement("div");
    c.className="corazon";
    c.innerHTML="💜";
    c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
}
setInterval(crearCorazon,300);

</script>

</body>
</html>
